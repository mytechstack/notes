services:
  # S3 stand-in (MinIO, S3-compatible API). Bucket web-manifests holds
  # immutable manifest versions and one pointer object per tenant/env.
  # WCR's key is MinIO's root user; WCR creates the bucket and gives it an
  # anonymous read-only policy on start-up. Official MinIO images are not
  # pullable, so this pins Bitnami's frozen legacy build.
  s3:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      - MINIO_ROOT_USER=wcr-access-key
      - MINIO_ROOT_PASSWORD=wcr-secret-key
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Web Composition Registry: generates + versions manifests into S3, owns
  # the pointer (stable / candidate / canary). Not on the request path.
  wrcs:
    build: ./services/wrcs
    ports:
      - "8091:8091"
    environment:
      - PORT=8091
      - ENVIRONMENTS=dev,sit,perf,uat,prod
      - S3_ENDPOINT=s3:9000
      - S3_BUCKET=web-manifests
      - S3_ACCESS_KEY=wcr-access-key
      - S3_SECRET_KEY=wcr-secret-key
      - CONTROL_PLANE_URL=http://control-plane:8093
      - WEBHOOK_URLS=http://web-runtime-service:8080/internal/cache-invalidate
    depends_on:
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  control-plane:
    build: ./services/control-plane
    ports:
      - "8093:8093"
    environment:
      - PORT=8093
      - DATA_DIR=/data
      - SEED_DIR=/app/seed
      - WRCS_EVENTS_URL=http://wrcs:8091/events
    volumes:
      - control-plane-data:/data
    depends_on:
      wrcs:
        condition: service_healthy

  oidc-shell:
    build: ./services/oidc-shell
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - JWT_SECRET=demo-secret-change-me
      - WRS_PUBLIC_URL=http://localhost:8080
      - CONTROL_PLANE_URL=http://control-plane:8093   # tenant list for the login page
      - ENVIRONMENTS=dev,sit,perf,uat,prod

  # Reads pointers + manifests straight from S3 (anonymous read, like a CDN)
  # and binds the environment-agnostic manifest to ?env='s hosts.
  web-runtime-service:
    build: ./services/web-runtime-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=demo-secret-change-me
      - MANIFEST_BASE_URL=http://s3:9000/web-manifests
      - ENV_BINDINGS=/etc/web-runtime/envs.json
      - DEFAULT_ENV=prod
    volumes:
      - ./infra/envs.json:/etc/web-runtime/envs.json:ro
    depends_on:
      wrcs:
        condition: service_healthy

  cdaas-mock:
    build: ./services/cdaas-mock
    ports:
      - "8092:80"

volumes:
  minio-data:
  control-plane-data:
